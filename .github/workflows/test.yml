name: Emacs 回帰テスト

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    env:
      # test-tty-live(emacs -nw)用。TERM 未設定/dumb では emacs -nw が起動できない。
      TERM: xterm-256color
    strategy:
      fail-fast: false
      matrix:
        include:
          - emacs-version: "30.2"
            experimental: false
          - emacs-version: snapshot
            experimental: true

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v6.0.2

      - name: Emacs をセットアップ
        uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs-version }}

      # runner 同梱の shellcheck はバージョンが固定されない。ubuntu-latest の
      # 実体が上がるとチェック集合が変わり、無関係な変更が make lint で落ちる。
      # ローカルと同じ版を明示導入して結果を揃える。
      - name: shellcheck をバージョン固定で導入
        env:
          SHELLCHECK_VERSION: "0.11.0"
        run: |
          set -Eeuo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 3 "$url" -o "$tmp/shellcheck.tar.xz"
          tar -xJf "$tmp/shellcheck.tar.xz" -C "$tmp"
          sudo install -m 0755 \
            "$tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          # 同梱版へ黙って落ちないよう、解決先と版の両方を検査する
          command -v shellcheck
          installed="$(shellcheck --version | awk '/^version:/ {print $2}')"
          test "$installed" = "$SHELLCHECK_VERSION"

      - name: straight.el キャッシュを復元
        id: straight-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            loads/straight/repos
            loads/straight/build
            loads/straight/build-cache.el
          key: straight-v3-${{ matrix.emacs-version }}-${{ hashFiles('loads/straight/versions/default.el') }}
          restore-keys: |
            straight-v3-${{ matrix.emacs-version }}-

      - name: lockfile のリビジョンを適用
        run: make straight-thaw

      - name: 回帰テストを実行
        run: make test
